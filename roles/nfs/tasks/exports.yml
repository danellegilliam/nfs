# code: language=ansible
---
- name: Create NFS exports file
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  register: nfs_exports_file_changed

- name: Reload exports via exportfs
  ansible.builtin.command:
    cmd: exportfs -rav
  changed_when: false
